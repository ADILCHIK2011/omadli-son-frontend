<!DOCTYPE html>
<html lang="uz" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hisob yaratish - Premium UI</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Poppins', sans-serif; }
      
      .animated-bg {
        background: linear-gradient(-45deg, #f0fdfa, #eff6ff, #f5f3ff, #ecfdf5);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Custom focus ring for better accessibility */
      .custom-input:focus {
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }
    </style>
  </head>
  <body class="min-h-screen animated-bg flex items-center justify-center p-4 sm:p-8 lg:p-12">

    <div class="w-full max-w-[420px] sm:max-w-[480px]">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-[24px] bg-white shadow-xl shadow-emerald-500/10 border border-emerald-50 mb-5 relative group">
          <div class="absolute -inset-1 rounded-[24px] bg-gradient-to-br from-emerald-400 to-blue-500 blur opacity-10 group-hover:opacity-30 transition duration-500"></div>
          
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-10 sm:h-10 text-emerald-500 relative" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 tracking-tight">Ro'yxatdan o'tish</h1>
        <p class="text-gray-500 mt-2 text-sm sm:text-base px-4">Yangi imkoniyatlar dunyosiga xush kelibsiz!</p>
      </div>

      <div class="card bg-white/80 backdrop-blur-md shadow-2xl shadow-emerald-900/5 border border-white rounded-[32px] overflow-hidden">
        <div class="card-body p-6 sm:p-10 gap-4 sm:gap-6">
          
          <div class="space-y-4">
            <div class="form-control">
              <label class="label pt-0 pb-1.5" for="usernameInput">
                <span class="label-text font-semibold text-gray-700 text-xs sm:text-sm flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A9 9 0 1118.88 6.196M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  Foydalanuvchi nomi
                </span>
              </label>
              <input id="usernameInput" type="text" placeholder="ali_karimov" class="input input-bordered border-gray-100 focus:border-emerald-300 focus:outline-none rounded-2xl bg-gray-50/50 w-full transition-all custom-input" />
            </div>

            <div class="form-control">
              <label class="label pt-0 pb-1.5" for="emailInput">
                <span class="label-text font-semibold text-gray-700 text-xs sm:text-sm flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                  Elektron pochta
                </span>
              </label>
              <input id="emailInput" type="email" placeholder="ali@example.com" class="input input-bordered border-gray-100 focus:border-blue-300 focus:outline-none rounded-2xl bg-gray-50/50 w-full transition-all custom-input" />
            </div>

            <div class="form-control">
              <label class="label pt-0 pb-1.5" for="phoneInput">
                <span class="label-text font-semibold text-gray-700 text-xs sm:text-sm flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-teal-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498A1 1 0 0121 15.72V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                  </svg>
                  Telefon raqam
                </span>
              </label>
              <input id="phoneInput" type="tel" placeholder="+998 90 123 45 67" class="input input-bordered border-gray-100 focus:border-teal-300 focus:outline-none rounded-2xl bg-gray-50/50 w-full transition-all custom-input" />
            </div>

            <div class="form-control">
              <label class="label pt-0 pb-1.5" for="passwordInput">
                <span class="label-text font-semibold text-gray-700 text-xs sm:text-sm flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  Parol
                </span>
              </label>
              <input id="passwordInput" type="password" placeholder="••••••••" class="input input-bordered border-gray-100 focus:border-emerald-300 focus:outline-none rounded-2xl bg-gray-50/50 w-full transition-all custom-input" />
            </div>
          </div>

          <button id="registerBtn" type="button" class="btn btn-lg h-[60px] rounded-2xl bg-gray-900 border-none text-white font-semibold text-lg hover:bg-gray-800 transition-all duration-300 shadow-xl shadow-gray-950/10 active:scale-95 mt-2">
            Ro'yxatdan o'tish
          </button>

          <div class="divider text-gray-300 text-[10px] sm:text-xs font-medium uppercase tracking-widest my-1">YOKI</div>

          <a href="../login/login.html" class="btn btn-outline btn-lg h-[60px] rounded-2xl border-blue-100 text-blue-600 hover:bg-blue-50 hover:border-blue-200 hover:text-blue-700 font-medium text-base">
            Tizimga kirish
          </a>
        </div>
      </div>

      <p class="text-center text-gray-400 text-xs sm:text-sm mt-8 px-6 font-medium">
        SSL xavfsizligi &nbsp;·&nbsp; 256-bitli shifrlash
      </p>
    </div>

    <script src="register.jsx"></script>
  </body>
</html>
