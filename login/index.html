<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish - Zamonaviy UI</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        /* Chiroyli fon animatsiyasi */
        .animated-bg {
            background: linear-gradient(-45deg, #ecfdf5, #f0fdfa, #eff6ff, #f0fdf4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen animated-bg flex items-center justify-center p-5 sm:p-6 lg:p-10">

    <div class="w-full max-w-[400px] sm:max-w-[450px]">

        <div class="text-center mb-8 sm:mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-white shadow-xl shadow-emerald-500/10 border border-emerald-50 mb-5 relative group">
                <div class="absolute -inset-1 rounded-3xl bg-gradient-to-br from-emerald-400 to-teal-500 blur-md opacity-20 group-hover:opacity-40 transition-opacity duration-300"></div>
                
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-10 sm:h-10 text-emerald-500 relative" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 tracking-tighter">Xush kelibsiz!</h1>
            <p class="text-gray-500 mt-2 text-sm sm:text-base font-normal px-2">Kirisish uchun hisob ma'lumotlarini kiriting</p>
        </div>

        <div class="card bg-white/90 backdrop-blur-sm shadow-2xl shadow-emerald-950/5 border border-white rounded-[32px] overflow-hidden">
            <div class="card-body p-7 sm:p-10 gap-5 sm:gap-6">

                <div class="space-y-4">
                    <div class="form-control">
                        <label class="label pt-0 pb-1.5" for="usernameInput">
                            <span class="label-text font-semibold text-gray-700 text-sm flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A9 9 0 1118.88 6.196M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                Foydalanuvchi nomi
                            </span>
                        </label>
                        <input
                            id="usernameInput"
                            type="text"
                            placeholder="masalan: ali_karimov"
                            class="input input-lg input-bordered border-gray-100 focus:border-emerald-300 focus:outline-none focus:ring-4 focus:ring-emerald-100 rounded-2xl bg-gray-50/50 w-full text-base transition duration-200 placeholder:text-gray-300"
                        />
                    </div>

                    <div class="form-control">
                        <label class="label pt-0 pb-1.5" for="passwordInput">
                            <span class="label-text font-semibold text-gray-700 text-sm flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                Parol
                            </span>
                        </label>
                        <input
                            id="passwordInput"
                            type="password"
                            placeholder="••••••••"
                            class="input input-lg input-bordered border-gray-100 focus:border-emerald-300 focus:outline-none focus:ring-4 focus:ring-emerald-100 rounded-2xl bg-gray-50/50 w-full text-base transition duration-200 placeholder:text-gray-300"
                        />
                        <div class="flex justify-end mt-2">
                            <a href="#" class="text-xs text-blue-500 hover:text-blue-600 font-semibold hover:underline">Parolni unutdingizmi?</a>
                        </div>
                    </div>
                </div>

                <button
                    id="loginBtn"
                    type="button"
                    class="btn btn-lg h-[60px] rounded-2xl bg-gray-900 border-none text-white font-semibold text-lg hover:bg-gray-800 transition-all duration-300 shadow-xl shadow-gray-950/10 active:scale-98"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14" />
                    </svg>
                    Tizimga kirish
                </button>

                <div class="divider text-gray-300 text-xs font-medium uppercase tracking-wider my-1">YOKI</div>

                <a href="../register/" class="btn btn-outline btn-lg h-[60px] rounded-2xl border-emerald-100 text-emerald-600 hover:bg-emerald-50 hover:border-emerald-200 hover:text-emerald-700 font-medium text-base">
                    Hisob yaratish
                </a>

            </div>
        </div>

        <p class="text-center text-gray-400 text-xs sm:text-sm mt-8 px-6 font-normal">
            SSL himoyasi &nbsp;·&nbsp; Ma'lumotlaringiz xavfsiz saqlanadi
        </p>

    </div>

    <script src="login.js"></script>
</body>
</html>
