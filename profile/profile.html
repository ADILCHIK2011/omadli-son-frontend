<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil | Paynet</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .gradient-bg {
        background: linear-gradient(135deg, #00a651 0%, #00c853 50%, #00a651 100%);
      }
      .info-item {
        transition: all 0.3s ease;
      }
      .info-item:hover {
        transform: translateX(8px);
        background: rgba(0, 200, 83, 0.05);
      }
      .uzb-pattern {
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body class="min-h-screen gradient-bg uzb-pattern flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-2xl">

      <!-- Profile Card -->
      <div class="glass-card rounded-3xl shadow-2xl overflow-hidden">

        <!-- Header Section -->
        <div class="bg-gradient-to-r from-green-600 to-green-500 p-8 text-white relative overflow-hidden">
          <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/2 blur-3xl"></div>
          <div class="absolute bottom-0 left-0 w-48 h-48 bg-white/10 rounded-full translate-y-1/2 -translate-x-1/2 blur-2xl"></div>

          <div class="relative z-10 flex items-center gap-4">
            <div class="w-20 h-20 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center border-2 border-white/30 shadow-lg">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <div>
              <h1 class="text-3xl font-bold">Shaxsiy kabinet</h1>
              <p class="text-green-50 text-sm mt-1">Hisob ma'lumotlari va boshqaruv</p>
            </div>
          </div>
        </div>

        <!-- Info Section -->
        <div class="p-8 space-y-4">

          <!-- User Info Grid -->
          <div class="grid gap-4">

            <!-- Name -->
            <div class="info-item flex items-center gap-4 p-4 rounded-xl bg-base-100 border border-base-200 shadow-sm">
              <div class="w-12 h-12 rounded-lg bg-blue-100 flex items-center justify-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <div class="flex-1">
                <p class="text-xl font-semibold text-gray-800" id="userName">Yuklanmoqda...</p>
              </div>
            </div>

            <!-- Email -->
            <div class="info-item flex items-center gap-4 p-4 rounded-xl bg-base-100 border border-base-200 shadow-sm">
              <div class="w-12 h-12 rounded-lg bg-purple-100 flex items-center justify-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </div>
              <div class="flex-1">
                <p class="text-xl font-semibold text-gray-800" id="userEmail">Yuklanmoqda...</p>
              </div>
            </div>

            <!-- Phone -->
            <div class="info-item flex items-center gap-4 p-4 rounded-xl bg-base-100 border border-base-200 shadow-sm">
              <div class="w-12 h-12 rounded-lg bg-green-100 flex items-center justify-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
              </div>
              <div class="flex-1">
                <p class="text-xl font-semibold text-gray-800" id="userPhone">Yuklanmoqda...</p>
              </div>
            </div>

            <!-- Password (Masked) -->
            <div class="info-item flex items-center gap-4 p-4 rounded-xl bg-base-100 border border-base-200 shadow-sm">
              <div class="w-12 h-12 rounded-lg bg-red-100 flex items-center justify-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <div class="flex-1">
                <p class="text-xl font-semibold text-gray-800" id="userPassword">••••••••</p>
              </div>
            </div>

            <!-- Balance (Highlighted) -->
            <div class="info-item flex items-center gap-4 p-4 rounded-xl bg-gradient-to-r from-green-50 to-emerald-50 border-2 border-green-200 shadow-md">
              <div class="w-12 h-12 rounded-lg bg-green-600 flex items-center justify-center shrink-0 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <div class="flex-1">
                <p class="text-2xl font-bold text-green-800" id="userBalance">Yuklanmoqda...</p>
              </div>
            </div>
          </div>

          <!-- Divider -->
          <div class="divider my-6"></div>

          <!-- Action Section -->
          <div class="bg-base-100 rounded-2xl p-6 border border-base-200 shadow-inner">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              Tezkor o'tkazma
            </h3>

            <div class="flex flex-col sm:flex-row gap-3">
              <div class="relative flex-1">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-semibold">so'm</span>
                <input
                  type="number"
                  id="moneyAmount"
                  class="input input-bordered w-full pl-16 h-14 text-lg focus:ring-2 focus:ring-success/50"
                  placeholder="0"
                  min="0"
                  step="1000"
                />
              </div>
              <button id="sendMoney" class="btn btn-success h-14 px-8 text-lg font-semibold shadow-lg hover:shadow-xl transition-all hover:scale-105 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
                Pul yuborish
              </button>
            </div>
            <p class="text-xs text-gray-500 mt-3">Paynet orqali pul o'tkazmasi uchun summani kiriting</p>
          </div>

        </div>
      </div>

      <!-- Footer -->
      <p class="text-center text-green-900/60 text-sm mt-6 font-medium">
        Paynet to'lov tizimlari bilan himoyalangan
      </p>
    </div>

    <script src="profile.js"></script>
  </body>
</html>
